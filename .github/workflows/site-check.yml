name: Site Build Check

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'src/**'
      - 'build.zig'
      - '.zig-version'
      - 'scripts/zig.sh'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'src/**'
      - 'build.zig'
      - '.zig-version'
      - 'scripts/zig.sh'
      - '.github/workflows/site-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for git lastmod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false

      - name: Install headers for the native API layout probe
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Check output
        working-directory: site
        run: |
          echo "=== Built pages ==="
          find dist -name '*.html' | sort
          echo "=== Checking critical files ==="
          test -f dist/index.html
          test -f dist/feed.xml
          test -f dist/sitemap-index.xml
          test -f dist/robots.txt
          echo "All checks passed."
