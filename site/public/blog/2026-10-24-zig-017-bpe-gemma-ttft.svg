  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans', 'Arial', 'Liberation Sans', sans-serif; fill: #526972" transform="translate(30.24 418.464)">Bars: median of 9 measured requests per build and prompt. Dots: medians of 3 independent server rounds.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans', 'Arial', 'Liberation Sans', sans-serif; fill: #526972" transform="translate(30.24 433.764)">2 warmups per case and server · greedy sampling · 4,096-token context · automatic GPU power management.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans', 'Arial', 'Liberation Sans', sans-serif; fill: #526972" transform="translate(30.24 449.064)">Same models, prompts and shaders. Baseline: the already optimized Zig 0.17 migration (9bb61b12).</text>
  </g>
